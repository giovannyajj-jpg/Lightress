<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Credencial - Litoral Process Services</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }
    .card {
      width: 54mm;
      height: 85mm;
      background: #ffffff;
      border: 2px solid #2b6cb0;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 8px;
      box-sizing: border-box;
      text-align: center;
    }
    .logo-container {
      margin-top: 5px;
    }
    .company-title {
      color: #1a365d;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 0.5px;
      margin-top: 4px;
      line-height: 1.2;
    }
    .user-name {
      color: #2d3748;
      font-size: 13px;
      font-weight: bold;
      line-height: 1.3;
      margin-top: 15px;
    }
    .id-number {
      color: #1a202c;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .qr-container {
      margin-top: 20px;
    }
    .contact-title {
      font-size: 13px;
      font-weight: bold;
      color: #2d3748;
      margin-top: 15px;
    }
    .contact-phone {
      font-size: 14px;
      font-weight: bold;
      color: #1a202c;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- FRENTE DE LA CREDENCIAL -->
  <div class="card">
    <div class="logo-container">
      <svg width="110" height="70" viewBox="0 0 120 80">
        <!-- Camarón -->
        <path d="M 35,45 C 10,40 10,15 35,15 C 50,15 55,25 45,35 C 40,40 30,42 35,45 Z" fill="none" stroke="#e53e3e" stroke-width="3"/>
        <circle cx="28" cy="22" r="2" fill="#e53e3e"/>
        <!-- Engranaje -->
        <circle cx="38" cy="35" r="7" fill="none" stroke="#2b6cb0" stroke-width="3"/>
        <!-- Texto LPS -->
        <text x="58" y="38" font-family="Arial" font-size="26" font-weight="900" fill="#2b6cb0">LPS</text>
        <!-- Olas -->
        <path d="M 38,48 Q 48,44 58,48 T 78,48 T 98,48" fill="none" stroke="#2b6cb0" stroke-width="2.5"/>
        <path d="M 38,53 Q 48,49 58,53 T 78,53 T 98,53" fill="none" stroke="#2b6cb0" stroke-width="2.5"/>
        <path d="M 38,58 Q 48,54 58,58 T 78,58 T 98,58" fill="none" stroke="#2b6cb0" stroke-width="2.5"/>
      </svg>
      <div class="company-title">
        LITORAL PROCESS<br>SERVICES
      </div>
    </div>

    <div class="user-name">
      LANDAZURI GORDILLO<br>ALFREDO GIOVANNY
    </div>

    <div class="id-number">
      C.I. 095648012
    </div>
  </div>

  <!-- REVERSO DE LA CREDENCIAL -->
  <div class="card" style="justify-content: center;">
    <div class="qr-container">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=TEL:0985440345" alt="Código QR Contacto" width="130" height="130">
    </div>
    <div class="contact-title">
      CONTACTO
    </div>
    <div class="contact-phone">
      0985440345
    </div>
  </div>

</body>
</html>
