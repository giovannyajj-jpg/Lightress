<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeltaNodes — Hosting de Servidores Épico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #07090e;
            --bg-card: rgba(18, 22, 33, 0.75);
            --bg-card-hover: rgba(26, 32, 48, 0.9);
            --gold-primary: #f59e0b;
            --gold-light: #fbbf24;
            --gold-glow: rgba(245, 158, 11, 0.4);
            --cyan-accent: #06b6d4;
            --cyan-glow: rgba(6, 182, 212, 0.3);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-glow: rgba(245, 158, 11, 0.2);
            --font-main: 'Outfit', sans-serif;
            --font-heading: 'Space Grotesk', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-main);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(245, 158, 11, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 55%, rgba(6, 182, 212, 0.07) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(245, 158, 11, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* Subtle cyber grid overlay */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: 60px 60px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            pointer-events: none;
            z-index: 0;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 6%;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(7, 9, 14, 0.75);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-text {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 30%, var(--gold-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: var(--gold-light);
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
        }

        /* BOTONES ÉPICOS */
        .btn-epic {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0.85rem 1.8rem;
            font-family: var(--font-heading);
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #000;
            background: linear-gradient(135deg, #fde047 0%, #f59e0b 50%, #d97706 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            overflow: hidden;
            text-decoration: none;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.4), inset 0 1px 0 rgba(255,255,255,0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1;
        }

        .btn-epic::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            transition: left 0.6s ease;
        }

        .btn-epic:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.7), 0 0 15px rgba(251, 191, 36, 0.9);
        }

        .btn-epic:hover::before {
            left: 100%;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: var(--gold-light);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.1);
        }

        .btn-outline:hover {
            background: rgba(245, 158, 11, 0.12);
            border-color: var(--gold-light);
            color: #fff;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.35);
        }

        /* Hero Section */
        .hero {
            position: relative;
            z-index: 1;
            padding: 5rem 5% 3rem;
            text-align: center;
            max-width: 1100px;
            margin: 0 auto;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 20px;
            border-radius: 50px;
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--gold-light);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2rem;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.15);
        }

        .hero h1 {
            font-family: var(--font-heading);
            font-size: 4.2rem;
            font-weight: 900;
            line-height: 1.08;
            margin-bottom: 1.5rem;
            background: linear-gradient(180deg, #ffffff 30%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .hero h1 span {
            background: linear-gradient(135deg, #fde047 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(245, 158, 11, 0.3));
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 720px;
            margin: 0 auto 2.5rem;
            line-height: 1.6;
        }

        .stats-strip {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-top: 3.5rem;
            padding: 1.8rem;
            background: rgba(18, 22, 33, 0.4);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
        }

        .stat-item {
            text-align: center;
        }

        .stat-num {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 900;
            color: var(--gold-light);
            text-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Pricing Section */
        .pricing-section {
            position: relative;
            z-index: 1;
            padding: 5rem 4%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-header h2 {
            font-family: var(--font-heading);
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 0.8rem;
            letter-spacing: -0.5px;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
            gap: 2rem;
            align-items: stretch;
        }

        /* Pricing Card */
        .pricing-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2.2rem 1.8rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            backdrop-filter: blur(14px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .pricing-card:hover {
            transform: translateY(-8px);
            background: var(--bg-card-hover);
            border-color: rgba(245, 158, 11, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(245, 158, 11, 0.15);
        }

        /* Highlight Plan Delta */
        .pricing-card.featured {
            background: linear-gradient(165deg, rgba(28, 35, 54, 0.95) 0%, rgba(14, 17, 26, 0.95) 100%);
            border: 2px solid var(--gold-primary);
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.3);
            transform: scale(1.03);
        }

        .pricing-card.featured:hover {
            transform: scale(1.03) translateY(-10px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 45px rgba(245, 158, 11, 0.45);
        }

        .popular-tag {
            position: absolute;
            top: 22px;
            right: -35px;
            background: linear-gradient(135deg, #fde047, #f59e0b);
            color: #000;
            font-size: 0.72rem;
            font-weight: 900;
            text-transform: uppercase;
            padding: 5px 40px;
            transform: rotate(45deg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            letter-spacing: 1px;
        }

        .plan-header {
            margin-bottom: 1.5rem;
        }

        .plan-name {
            font-family: var(--font-heading);
            font-size: 1.55rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .plan-name i {
            color: var(--gold-light);
            font-size: 1.3rem;
        }

        .plan-price {
            display: flex;
            align-items: baseline;
            gap: 4px;
            margin-top: 1rem;
        }

        .currency {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--gold-light);
        }

        .amount {
            font-family: var(--font-heading);
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            line-height: 1;
        }

        .period {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
        }

        .plan-features {
            list-style: none;
            margin: 1.8rem 0;
            display: flex;
            flex-direction: column;
            gap: 0.95rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 1.5rem;
        }

        .plan-features li {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.98rem;
            color: #e5e7eb;
        }

        .plan-features li i {
            color: var(--gold-light);
            font-size: 1rem;
            width: 20px;
            text-align: center;
        }

        .plan-features li.highlight {
            color: #fff;
            font-weight: 600;
        }

        .plan-features li.highlight i {
            color: var(--cyan-accent);
            filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.6));
        }

        .pricing-card .btn-epic {
            width: 100%;
            margin-top: 1rem;
        }

        /* Features Section */
        .features-section {
            padding: 5rem 5%;
            max-width: 1300px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .feature-box {
            background: rgba(18, 22, 33, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 2.2rem;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .feature-box:hover {
            background: rgba(26, 32, 48, 0.7);
            border-color: rgba(245, 158, 11, 0.35);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .feature-icon {
            width: 56px;
            height: 56px;
            background: rgba(245, 158, 11, 0.1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold-light);
            font-size: 1.6rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(245, 158, 11, 0.25);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.15);
        }

        .feature-box h3 {
            font-family: var(--font-heading);
            font-size: 1.35rem;
            font-weight: 800;
            margin-bottom: 0.7rem;
        }

        .feature-box p {
            color: var(--text-muted);
            font-size: 0.98rem;
            line-height: 1.6;
        }

        /* MODAL WINDOWS STYLES */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 7, 10, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background: rgba(18, 22, 33, 0.95);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 24px;
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 3rem;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(245, 158, 11, 0.15);
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-container {
            transform: translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(245, 158, 11, 0.2);
            color: var(--gold-light);
            border-color: var(--gold-primary);
        }

        .modal-container h2 {
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--gold-light);
            margin-bottom: 1.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-container h3 {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            color: #fff;
            margin-top: 1.5rem;
            margin-bottom: 0.6rem;
        }

        .modal-container p {
            color: var(--text-muted);
            font-size: 0.98rem;
            line-height: 1.7;
            margin-bottom: 1rem;
        }

        .modal-container ul {
            list-style: disc;
            padding-left: 1.5rem;
            color: var(--text-muted);
            font-size: 0.98rem;
            line-height: 1.7;
            margin-bottom: 1rem;
        }

        .modal-container li {
            margin-bottom: 0.4rem;
        }

        /* Footer */
        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 3.5rem 5% 2.5rem;
            position: relative;
            z-index: 1;
            background: rgba(5, 7, 10, 0.95);
            text-align: center;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.8rem;
        }

        .footer-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            flex-wrap: wrap;
            justify-content: center;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .footer-links a:hover {
            color: var(--gold-light);
        }

        .copyright {
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.9rem;
        }

        /* Responsive Global */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.8rem; }
            .nav-links { display: none; }
            .pricing-card.featured { transform: none; }
            .pricing-card.featured:hover { transform: translateY(-8px); }
            
            .modal-container {
                padding: 1.8rem;
                border-radius: 16px;
                max-height: 90vh;
            }
            .modal-container h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
